# Runs ruff lint + pytest across supported Python versions on every push to
# main and every PR. Offline only — no cloud backends exercised in CI.

name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check runplz tests
      - name: Ruff format check
        run: ruff format --check runplz tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,modal]"
      - name: Run tests
        run: pytest tests/ -v --cov=runplz --cov-report=xml

  # The default ssh end-to-end run uses a local sshd, which on Linux is
  # already the production platform. This job exercises the *container*
  # backend instead, which is the path a macOS developer gets — otherwise
  # it would only ever run on someone's laptop and break unnoticed.
  e2e-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the ssh e2e tier against a Linux container
        env:
          RUNPLZ_E2E_REMOTE: docker
        run: pytest tests/test_e2e_localhost.py tests/test_e2e_fake_cloud.py -v
