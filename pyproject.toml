[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runplz"
dynamic = ["version"]
description = "Tiny Modal-shaped job harness — one declaration, multiple backends (local Docker / Brev / Modal)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Alex Rubinsteyn", email = "alex.rubinsteyn@unc.edu"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
# runplz core depends only on the stdlib. Backends use subprocess to shell out
# to `docker`, `ssh`, `rsync`, `brev` (CLI tools). Modal is an optional extra.
dependencies = []

[project.optional-dependencies]
modal = ["modal>=1.1,<2"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    # Test-only. botocore bundles the authoritative EC2 instance-type
    # catalogue offline, so tests/test_cloud_catalogue.py can prove every
    # shape runplz emits is a real instance type without an AWS account.
    # runplz itself stays stdlib-only at runtime.
    "botocore",
    # Test-only. Backs the optional container variant of the ssh end-to-end
    # tier, which gives a Linux remote on a macOS dev box so the detached
    # tests run there instead of skipping. Falls back to a local sshd when
    # Docker is not available.
    "testcontainers",
]

[project.scripts]
runplz = "runplz.cli:main"

[project.urls]
Homepage = "https://github.com/pirl-unc/runplz"
Repository = "https://github.com/pirl-unc/runplz"

[tool.setuptools.packages.find]
include = ["runplz*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.dynamic]
version = {attr = "runplz.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
